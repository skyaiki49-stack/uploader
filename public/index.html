<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCHLERN Roblox Audio Uploader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-2xl bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
        <h1 class="text-2xl font-bold mb-4 text-center text-indigo-400">MCHLERN Audio Uploader Panel</h1>
        
        <!-- Status Akun -->
        <div id="auth-section" class="mb-6 p-4 bg-slate-900 rounded-xl border border-slate-700 flex flex-col items-center">
            <p id="user-status" class="text-sm text-slate-400 mb-3">Memeriksa sambungan Discord & Roblox...</p>
            <a id="discord-login-btn" href="/auth/discord" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium transition text-sm">Login via Discord</a>
        </div>

        <!-- Tab Audio Converter & Worker -->
        <div id="uploader-section" class="hidden space-y-4">
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
                <h2 class="text-lg font-semibold mb-3 text-indigo-300">Audio Converter & Bypass Worker</h2>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Link YouTube / TikTok / Media</label>
                        <input type="text" id="media-url" placeholder="https://www.youtube.com/watch?v=..." class="w-full bg-slate-800 border border-slate-600 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Speed</label>
                            <input type="number" id="audio-speed" value="1.0" step="0.1" min="0.5" max="3.0" class="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-sm text-white">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Pitch</label>
                            <input type="number" id="audio-pitch" value="1.0" step="0.1" min="0.5" max="2.0" class="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-sm text-white">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Volume</label>
                            <input type="number" id="audio-volume" value="1.0" step="0.1" min="0.1" max="2.0" class="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-sm text-white">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Judul Custom Audio di Roblox</label>
                        <input type="text" id="custom-title" placeholder="Nama Audio" class="w-full bg-slate-800 border border-slate-600 rounded-lg p-2.5 text-sm text-white">
                    </div>

                    <button onclick="submitQueue()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg transition text-sm">
                        Kirim ke Antrean Worker Termux
                    </button>
                </div>
            </div>

            <!-- Progress Bar Real-Time (Ditambahkan tanpa merusak layout) -->
            <div id="progress-container" class="hidden bg-slate-900 p-4 rounded-xl border border-slate-700">
                <div class="flex justify-between text-xs text-slate-400 mb-1">
                    <span id="progress-status-text">Memproses antrean...</span>
                    <span id="progress-percentage">0%</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
                    <div id="upload-progress-bar" class="bg-indigo-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <!-- Riwayat Upload -->
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
                <h3 class="text-sm font-semibold text-slate-300 mb-2">Riwayat Upload Terakhir</h3>
                <div id="history-list" class="space-y-2 text-xs text-slate-400 max-h-40 overflow-y-auto">
                    <p>Memuat riwayat...</p>
                </div>
            </div>
        </div>

        <!-- Setup Roblox API Key -->
        <div id="settings-section" class="mt-6 pt-4 border-t border-slate-700">
            <h3 class="text-sm font-semibold text-slate-300 mb-2">Koneksi Roblox Open Cloud</h3>
            <div class="space-y-2">
                <input type="text" id="roblox-userid" placeholder="Roblox User ID" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white">
                <input type="password" id="roblox-apikey" placeholder="Open Cloud API Key" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white">
                <button onclick="connectRoblox()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg text-sm transition">Simpan & Sambungkan</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const discordId = urlParams.get('discordId');

        async function init() {
            if (!discordId) {
                document.getElementById('user-status').innerText = 'Sila login menggunakan akaun Discord terlebih dahulu.';
                return;
            }

            try {
                const res = await fetch(`/api/discord/user/${discordId}`);
                const data = await res.json();
                if (data.success) {
                    document.getElementById('auth-section').innerHTML = `
                        <div class="flex items-center gap-3">
                            <img src="${data.user.avatar}" class="w-10 h-10 rounded-full">
                            <div>
                                <p class="font-semibold text-sm">${data.user.globalName}</p>
                                <p class="text-xs text-emerald-400">Discord Connected</p>
                            </div>
                        </div>
                    `;
                    document.getElementById('uploader-section').classList.remove('hidden');
                    if (data.robloxUser) {
                        document.getElementById('roblox-userid').value = data.robloxUser.userId;
                        document.getElementById('roblox-apikey').value = data.robloxUser.apiKey;
                    }
                    loadHistory();
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function connectRoblox() {
            const userId = document.getElementById('roblox-userid').value;
            const apiKey = document.getElementById('roblox-apikey').value;
            if (!discordId || !userId || !apiKey) return alert('Sila isi semua data!');

            const res = await fetch('/api/connect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ discordId, userId, apiKey })
            });
            const data = await res.json();
            if (data.success) {
                alert('Berhasil menyambungkan ke Roblox!');
                loadHistory();
            } else {
                alert(data.message || 'Gagal menyambungkan.');
            }
        }

        async function submitQueue() {
            const url = document.getElementById('media-url').value;
            const customTitle = document.getElementById('custom-title').value || 'Converted Audio';
            const speed = document.getElementById('audio-speed').value;
            const pitch = document.getElementById('audio-pitch').value;
            const volume = document.getElementById('audio-volume').value;

            if (!url) return alert('Masukkan link YouTube atau TikTok!');

            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('upload-progress-bar');
            const progressPercentage = document.getElementById('progress-percentage');
            const statusText = document.getElementById('progress-status-text');

            progressContainer.classList.remove('hidden');
            progressBar.style.width = '20%';
            progressPercentage.innerText = '20%';
            statusText.innerText = 'Mengirim antrean & parameter ke server...';

            try {
                const res = await fetch('/api/upload-batch-url', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        discordId,
                        items: [{ originalUrl: url, customTitle }],
                        speed,
                        pitch,
                        volume
                    })
                });
                const data = await res.json();

                if (data.success) {
                    progressBar.style.width = '50%';
                    progressPercentage.innerText = '50%';
                    statusText.innerText = 'Diproses Termux worker (Speed & Pitch aktif)...';

                    let step = 50;
                    const timer = setInterval(() => {
                        step += 10;
                        if (step >= 90) step = 90;
                        progressBar.style.width = step + '%';
                        progressPercentage.innerText = step + '%';
                    }, 1000);

                    setTimeout(() => {
                        clearInterval(timer);
                        progressBar.style.width = '100%';
                        progressPercentage.innerText = '100%';
                        statusText.innerText = 'Berhasil di-upload ke Roblox!';
                        setTimeout(() => {
                            progressContainer.classList.add('hidden');
                            loadHistory();
                        }, 2000);
                    }, 5000);
                } else {
                    alert(data.message);
                    progressContainer.classList.add('hidden');
                }
            } catch (err) {
                alert('Gagal menghubungi server.');
                progressContainer.classList.add('hidden');
            }
        }

        async function loadHistory() {
            if (!discordId) return;
            const res = await fetch(`/api/history/${discordId}`);
            const data = await res.json();
            if (data.success) {
                const list = document.getElementById('history-list');
                if (data.history.length === 0) {
                    list.innerHTML = '<p>Belum ada riwayat upload.</p>';
                    return;
                }
                list.innerHTML = data.history.map(h => `
                    <div class="bg-slate-800 p-2 rounded flex justify-between items-center">
                        <div>
                            <p class="font-medium text-white">${h.name}</p>
                            <p class="text-slate-400">Asset ID: <span class="text-indigo-400">${h.assetId}</span></p>
                        </div>
                        <span class="text-emerald-400">${h.status}</span>
                    </div>
                `).join('');
            }
        }

        init();
    </script>
</body>
</html>
